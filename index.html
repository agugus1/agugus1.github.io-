<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — agugus1</title>

<!-- Misma familia tipográfica que el resto del sitio -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     TOKENS DE DISEÑO
     Mismos que index.html para mantener una identidad consistente.
     Se agregan colores de categoría (--cat-*) para el catálogo.
     ============================================================ */
  :root{
    --bg: #F4F6F2;
    --surface: #FFFFFF;
    --surface-2: #EEF1EA;
    --ink: #1B211D;
    --ink-soft: #5B6660;
    --line: #D8DED2;
    --accent: #3F6C51;
    --accent-soft: #E4EEE3;
    --accent-contrast: #FFFFFF;
    --gold: #B98B3E;
    --gold-soft: #F5E9D3;
    --margin-rule: #C8746B;

    /* Colores por categoría — editar aquí si agregás una categoría nueva */
    --cat-datos: #3F6C51;
    --cat-datos-soft: #E4EEE3;
    --cat-web: #7A5A3A;
    --cat-web-soft: #F0E6D8;
    --cat-docs: #45607A;
    --cat-docs-soft: #E3EAF0;

    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(20,25,20,.04), 0 8px 24px -12px rgba(20,25,20,.12);

    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: light;
  }

  html[data-theme="dark"]{
    --bg: #14181A;
    --surface: #1C2124;
    --surface-2: #232A2C;
    --ink: #ECEFEA;
    --ink-soft: #97A29B;
    --line: #2E3538;
    --accent: #74C08E;
    --accent-soft: #1F3327;
    --accent-contrast: #0E1512;
    --gold: #E0B466;
    --gold-soft: #332A16;
    --margin-rule: #7A4038;

    --cat-datos: #74C08E;
    --cat-datos-soft: #1F3327;
    --cat-web: #D8A968;
    --cat-web-soft: #332A16;
    --cat-docs: #86AEDA;
    --cat-docs-soft: #1E2A38;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    transition: background .25s ease, color .25s ease;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------------- Encabezado ---------------- */
  .top{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
  }
  .top h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .top p.lead{
    color: var(--ink-soft);
    max-width: 56ch;
    margin: 0;
  }
  .top p.lead a{ color: var(--accent); border-bottom: 1px dashed var(--accent); }

  .theme-btn{
    flex: 0 0 auto;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease;
  }
  .theme-btn:hover{ transform: translateY(-1px); }
  .theme-btn svg{ width: 20px; height: 20px; }
  .theme-btn .sun{ display: none; }
  html[data-theme="dark"] .theme-btn .moon{ display: none; }
  html[data-theme="dark"] .theme-btn .sun{ display: block; }

  /* ---------------- Barra de control: búsqueda + filtros ---------------- */
  .controls{
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .search-row{
    position: relative;
  }
  .search-row svg{
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 17px; height: 17px;
    color: var(--ink-soft);
    pointer-events: none;
  }
  #searchInput{
    width: 100%;
    padding: 12px 14px 12px 40px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
  }
  #searchInput:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .filters{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip{
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s ease;
  }
  .chip[aria-pressed="true"]{
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .chip:hover{ border-color: var(--accent); }

  /* ---------------- Contador de resultados ---------------- */
  .count{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 18px;
    margin-bottom: 4px;
  }

  /* ---------------- Grilla de tarjetas ---------------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 10px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover{ transform: translateY(-2px); border-color: var(--accent); }

  /* seña visual heredada del resto del sitio: línea de margen */
  .card::before{
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--margin-rule);
    opacity: .5;
  }

  .card-head{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card-head h2{
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    margin: 0;
  }
  .card-head h2 a{ transition: color .15s ease; }
  .card-head h2 a:hover{ color: var(--accent); }

  .badge{
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.cat-datos{ color: var(--cat-datos); background: var(--cat-datos-soft); }
  .badge.cat-web{ color: var(--cat-web); background: var(--cat-web-soft); }
  .badge.cat-docs{ color: var(--cat-docs); background: var(--cat-docs-soft); }

  .card p.desc{
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
    flex: 1;
  }

  .card .tags{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .card .tag{
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }

  .card .foot{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .card .commits{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .card .visit{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    color: var(--accent);
  }
  .card .visit svg{ width: 14px; height: 14px; transition: transform .15s ease; }
  .card:hover .visit svg{ transform: translate(2px, -2px); }

  .empty{
    padding: 50px 20px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty .glyph{
    font-family: var(--font-display);
    font-size: 34px;
    color: var(--line);
    margin-bottom: 6px;
  }

  footer.credit{
    text-align: center;
    margin-top: 40px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  @media (max-width: 480px){
    .wrap{ padding: 20px 14px 60px; }
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== Encabezado ===== -->
  <header class="top">
    <div>
      <h1>Catálogo de repositorios</h1>
      <p class="lead">Todo lo que <a href="https://github.com/agugus1" target="_blank" rel="noopener">agugus1</a> viene subiendo a GitHub: ejercicios, apuntes y proyectos de práctica.</p>
    </div>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Alternar modo oscuro / claro">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <!-- ===== Búsqueda + filtros por categoría ===== -->
  <div class="controls">
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar por nombre o tecnología…" aria-label="Buscar repositorios">
    </div>
    <div class="filters" role="group" aria-label="Filtrar por categoría">
      <button class="chip" data-cat="todas" aria-pressed="true">Todas</button>
      <button class="chip" data-cat="datos" aria-pressed="false">Python &amp; Datos</button>
      <button class="chip" data-cat="web" aria-pressed="false">Desarrollo web</button>
      <button class="chip" data-cat="docs" aria-pressed="false">Documentación</button>
    </div>
  </div>

  <p class="count" id="resultCount"></p>

  <!-- ===== Grilla de repositorios (se rellena por JS desde REPOS) ===== -->
  <div class="grid" id="grid"></div>

  <div class="empty" id="emptyState" hidden>
    <div class="glyph">?</div>
    <p>No encontré repositorios que coincidan con la búsqueda.</p>
  </div>

  <footer class="credit">Catálogo generado a partir de los repositorios públicos de agugus1</footer>
</div>

<script>
/* ============================================================
   DATOS DEL CATÁLOGO
   Para agregar un repositorio nuevo, sumá un objeto a este array.
   category: 'datos' | 'web' | 'docs'
   ============================================================ */
const REPOS = [
  {
    name: "agugus1",
    url: "https://github.com/agugus1/agugus1",
    category: "docs",
    tags: ["Perfil"],
    commits: "Perfil de GitHub",
    desc: "Repositorio especial de perfil: el README que se muestra en la página principal de agugus1 en GitHub."
  },
  {
    name: "ejercicio",
    url: "https://github.com/agugus1/ejercicio",
    category: "datos",
    tags: ["Python", "Pandas", "CSV"],
    commits: "23 commits",
    desc: "Serie de ejercicios en Python con Pandas: lectura de CSV, selección de filas y columnas, y funciones como sum, count o shape."
  },
  {
    name: "php",
    url: "https://github.com/agugus1/php",
    category: "web",
    tags: ["PHP", "MySQL", "Bootstrap"],
    commits: "25 commits",
    desc: "Aplicación CRUD con PHP y MySQL: un formulario para cargar personas y una tabla que muestra los registros guardados en la base de datos."
  },
  {
    name: "IA",
    url: "https://github.com/agugus1/IA",
    category: "datos",
    tags: ["Markdown", "Machine Learning", "Pandas"],
    commits: "9 commits",
    desc: "Apuntes introductorios sobre inteligencia artificial y machine learning: tipos de IA, DataFrames, y las librerías Pandas, NumPy y Matplotlib."
  },
  {
    name: "graficas-seaborn",
    url: "https://github.com/agugus1/graficas-seaborn",
    category: "datos",
    tags: ["Python", "Seaborn", "Visualización"],
    commits: "7 commits",
    desc: "Práctica con los principales tipos de gráficos de Seaborn: dispersión, distribución, categóricos, regresión y mapas de calor."
  },
  {
    name: "recursividad",
    url: "https://github.com/agugus1/recursividad",
    category: "datos",
    tags: ["Python", "Algoritmos"],
    commits: "4 commits",
    desc: "Introducción a la recursividad en Python, con el cálculo de factorial como caso de estudio."
  },
  {
    name: "prueba",
    url: "https://github.com/agugus1/prueba",
    category: "datos",
    tags: ["Python", "Pandas", "CSV"],
    commits: "3 commits",
    desc: "Ejercicios de práctica con un dataset de rendimiento estudiantil: selección de columnas, tipos de datos y estadísticas básicas."
  },
  {
    name: "graficas-mathplolib",
    url: "https://github.com/agugus1/graficas-mathplolib",
    category: "datos",
    tags: ["Python", "Matplotlib", "Visualización"],
    commits: "2 commits",
    desc: "Colección de gráficos con Matplotlib: barras, cajas, mapas de calor, histogramas, dispersión 3D y superficies."
  },
  {
    name: "html",
    url: "https://github.com/agugus1/html",
    category: "web",
    tags: ["HTML"],
    commits: "26 commits",
    desc: "Fundamentos de HTML: estructura de página, etiquetas, atributos, hipervínculos y contenido multimedia, con varias páginas de práctica."
  },
  {
    name: "Bootstap",
    url: "https://github.com/agugus1/Bootstap",
    category: "web",
    tags: ["HTML", "Bootstrap"],
    commits: "6 commits",
    desc: "Práctica con el framework Bootstrap para maquetar páginas responsivas a partir de sus componentes y clases utilitarias."
  },
  {
    name: "MarkDown",
    url: "https://github.com/agugus1/MarkDown",
    category: "docs",
    tags: ["Markdown"],
    commits: "2 commits",
    desc: "Guía de referencia con la sintaxis básica de Markdown: encabezados, listas, énfasis, enlaces, imágenes, citas y bloques de código."
  }
];

const CATEGORY_LABEL = {
  datos: "Python & Datos",
  web: "Desarrollo web",
  docs: "Documentación"
};

/* ============================================================
   TEMA (comparte lógica y clave de almacenamiento con index.html)
   ============================================================ */
const root = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const THEME_KEY = 'cuaderno.theme.v1';

function applyTheme(theme){
  root.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
}
const savedTheme = localStorage.getItem(THEME_KEY);
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

themeBtn.addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
});

/* ============================================================
   ESTADO DE FILTROS
   ============================================================ */
let currentCategory = 'todas';
let searchTerm = '';

const chips = document.querySelectorAll('.chip');
chips.forEach(chip => {
  chip.addEventListener('click', () => {
    chips.forEach(c => c.setAttribute('aria-pressed', 'false'));
    chip.setAttribute('aria-pressed', 'true');
    currentCategory = chip.dataset.cat;
    render();
  });
});

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

/* ============================================================
   RENDER
   ============================================================ */
const gridEl = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const resultCount = document.getElementById('resultCount');

function matchesFilters(repo){
  const inCategory = currentCategory === 'todas' || repo.category === currentCategory;
  const haystack = (repo.name + ' ' + repo.tags.join(' ') + ' ' + repo.desc).toLowerCase();
  const inSearch = !searchTerm || haystack.includes(searchTerm);
  return inCategory && inSearch;
}

function render(){
  const visible = REPOS.filter(matchesFilters);

  resultCount.textContent = `${visible.length} de ${REPOS.length} repositorios`;
  gridEl.innerHTML = '';
  emptyState.hidden = visible.length !== 0;

  visible.forEach(repo => {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <h2><a href="${repo.url}" target="_blank" rel="noopener">${repo.name}</a></h2>
        <span class="badge cat-${repo.category}">${CATEGORY_LABEL[repo.category]}</span>
      </div>
      <p class="desc">${repo.desc}</p>
      <div class="tags">
        ${repo.tags.map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="foot">
        <span class="commits">${repo.commits}</span>
        <a class="visit" href="${repo.url}" target="_blank" rel="noopener">
          Ver repo
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </a>
      </div>
    `;
    gridEl.appendChild(card);
  });
}

render();
</script>
</body>
</html>
